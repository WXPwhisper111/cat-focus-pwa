<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>猫咪日常 · 隔离界面验收</title></head><body><main><p>隔离界面验收：不连接用户存档；更新状态为测试模拟。</p><div class="actions" id="controls"></div><section class="room-card" id="room"></section><section class="cat-card" id="focus"></section><div data-update-card-slot></div><div data-update-banner-slot></div><p id="result" role="status"></p></main><script type="module">
import '/src/style.css';import '/src/room-scene.css';import '/src/app-update.css';
import {catDefinitions} from '/src/cat-definition.ts';import {createRoomScene,roomHotspots} from '/src/room-scene.ts';import {createRoomBehavior} from '/src/room-behavior.ts';import {createFocusCat} from '/src/focus-cat.ts';import {stretchClip} from '/src/cat-stretch.ts';import {createAppUpdateView} from '/src/app-update-view.ts';import {installDialogDismiss} from '/src/dialog-dismiss.ts';import notes from '/release-notes.json';
installDialogDismiss();let ids=catDefinitions.slice(3),selected=ids[0].id;
const scene=createRoomScene('idle',{cat:ids[0],cats:ids,hotspots:roomHotspots.filter(h=>h.itemId!=='curtains'),onCatAction:id=>{selected=id;scene.setSelected(id);},onItemAction:item=>void request(item==='bed'?'sleep':item==='foodBowl'?'eat':item==='waterBowl'?'drink':item==='scratcher'?'scratch':'return-home')});
document.querySelector('#room').append(scene.element);scene.setSelected(selected);const runner=createRoomBehavior(scene.behaviorPort);
const focus=createFocusCat('idle',catDefinitions[0]);document.querySelector('#focus').append(focus.element);
const result=document.querySelector('#result');function request(behavior,source='manual'){return runner.execute({catId:selected,behavior,source},new AbortController().signal).catch(error=>{if(error.name!=='AbortError')result.textContent=error.message;});}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;document.querySelector('#controls').append(b);}
button('返回地毯',()=>void request('return-home'));button('模拟自主如厕',()=>void request('toilet','autonomous'));button('睡觉反馈',()=>void request('sleep'));button('抚摸反馈',()=>void request('pet'));button('打断去喝水',()=>void request('drink'));button('查看伸懒腰',()=>{if(!runner.busy(selected))void scene.behaviorPort.play(selected,stretchClip(selected),{onComplete:()=>void scene.behaviorPort.idle(selected)});});
button('切换前三猫',async()=>{for(const id of scene.behaviorPort.ids)await runner.stopCat(id);ids=catDefinitions.slice(0,3);scene.updateResidents(ids);runner.reconcile();selected=ids[0].id;scene.setSelected(selected);});
button('普通弹窗',()=>{const d=document.createElement('dialog');d.className='version-update-dialog';d.innerHTML='<h2>普通弹窗</h2><p>点击外部遮罩可关闭。</p><button>关闭</button>';d.querySelector('button').onclick=()=>d.close();d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal();});
let status={phase:'current',current:'test-current',latest:'test-current',message:'',applying:false,mediaPhase:'complete',cached:4,total:4,release:notes};let listener;
const controller={snapshot:()=>status,subscribe:fn=>{listener=fn;fn(status);return ()=>{};},check:async()=>{},retryMedia(){},async apply(){result.textContent='测试已触发更新流程';status={...status,phase:'current',current:status.latest};listener(status);}};
const view=createAppUpdateView(controller,()=>false,{canShow:()=>!document.querySelector('dialog[open]'),openSettings:()=>{result.textContent='已定位设置更新区域';}});view.mount();
button('模拟发现新版本',()=>{status={...status,phase:'ready',latest:'qa-'+Date.now()};listener(status);});
window.addEventListener('pagehide',()=>{runner.destroy();scene.destroy();focus.destroy();view.destroy();},{once:true});
</script></body></html>
