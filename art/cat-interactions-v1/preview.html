<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三只猫交互动画 V1 · 实尺预览</title>
<link rel="stylesheet" href="../../src/style.css">
<style>
body{margin:0}main{padding:15px 20px 28px}h1{font-size:21px;margin:0 0 8px}p{font-size:13px;line-height:1.6;color:#826e60}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.controls select,.controls button{font:inherit;font-size:13px;padding:8px;border:1px solid #ddc9b2;border-radius:10px;background:#fffaf3;color:#49372f}.controls label{font-size:13px;display:flex;align-items:center;gap:4px}.scene{width:100%;aspect-ratio:4/3;height:auto;display:block;image-rendering:pixelated;border-radius:12px}.focus{width:176px;height:176px;image-rendering:pixelated;display:block;margin:auto}.zoom{width:min(384px,100%);height:auto;aspect-ratio:1;image-rendering:pixelated;display:block;margin:auto}.card{border:1px solid #ebdccb;border-radius:14px;background:#fffaf3;overflow:hidden;margin:8px 0 16px}.focus-card{min-height:210px;display:flex;align-items:center;justify-content:center;background:#fff8ea}.caption{font-size:12px;color:#7a6553;margin:10px 0 4px}.error{color:#a33}.metric{font:12px ui-monospace,monospace;color:#7a6553;margin:8px 0}
</style>
<main>
<h1>三只猫交互动画 V1</h1>
<p>每次播放依次经过进入、循环两轮、退出；抚摸反应只播放一次。可切换猫、动作与接触点标记，检查房间、专注卡和放大效果。</p>
<div class="controls">
<select id="catChoice" aria-label="猫咪"><option value="cat-01">橘白短毛</option><option value="cat-02">灰白长毛</option><option value="cat-03">奶油长毛</option></select>
<select id="actionChoice" aria-label="动作"><option value="eat">吃饭</option><option value="drink">喝水</option><option value="scratch">抓挠</option><option value="pet">抚摸反应</option></select>
<label><input type="checkbox" id="marker">接触点</label><button id="restart">重新播放</button>
</div>
<div id="metric" class="metric"></div><div id="error" class="error"></div>
<div class="caption">房间实尺 · 现有 1024 × 768 布局</div><div class="card"><canvas id="room" class="scene" width="1024" height="768"></canvas></div>
<div class="caption">专注卡实尺 · 176 像素</div><div class="card focus-card"><canvas id="focus" class="focus" width="288" height="288"></canvas></div>
<div class="caption">放大预览 · 查看头部与前爪</div><div class="card"><canvas id="zoom" class="zoom" width="384" height="384"></canvas></div>
</main>
<script>
window.previewReady=(async()=>{
 const layout=await fetch('../room-v0.1/scene-calibration/layout.json').then(r=>r.json());
 const room=document.getElementById('room'),focus=document.getElementById('focus'),zoom=document.getElementById('zoom');
 const backgrounds=new Map();
 const load=url=>new Promise((yes,no)=>{const im=new Image();im.onload=()=>im.decode().then(()=>yes(im),no);im.onerror=()=>no(Error(url));im.src=url;});
 await Promise.all(layout.layers.filter(l=>l.file&&l.id!=='cat').map(async l=>backgrounds.set(l.id,await load('../../public/room/'+l.file))));
 const scene=document.createElement('canvas');scene.width=1024;scene.height=768;
 const base=scene.getContext('2d');base.imageSmoothingEnabled=false;
 for(const l of layout.layers){if(l.id==='cat'||l.primitive)continue;base.drawImage(backgrounds.get(l.id),...l.rect);}
 const manifests=new Map(),images=new Map();let config={cat:'cat-01',action:'eat',marker:false},timeline=[],contact=null,start=performance.now(),force=null;
 const ctx=[room,focus,zoom].map(c=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x;});
 function events(manifest,action){const clips=manifest.actions[action],names=action==='pet'?['once']:['enter','loop','loop','exit'];let t=0;const out=[];
  for(const name of names)for(let i=0;i<clips[name].frames.length;i++){const f=clips[name].frames[i];out.push({start:t,end:t+f.durationMs,segment:name,index:i,frame:f,meta:clips[name]});t+=f.durationMs;}
  return {frames:out,duration:t};}
 async function switchTo(){const cat=config.cat,action=config.action;timeline=[];
  let manifest=manifests.get(cat);if(!manifest){manifest=await fetch(`../../public/cat-interactions-v1/${cat}/animations.json`).then(r=>r.json());manifests.set(cat,manifest);}
  const data=events(manifest,action);let paths=[...new Set(data.frames.map(e=>e.frame.mobileFile))];await Promise.all(paths.map(async f=>{const key=cat+'/'+f;if(!images.has(key))images.set(key,await load('../../public/cat-interactions-v1/'+key));}));
  timeline=data;contact=manifest.actions[action].loop?.contact||null;start=performance.now();force=null;draw(0);}
 function draw(ms){if(!timeline.frames)return;const t=Math.max(0,ms%(timeline.duration+550));const e=timeline.frames.find(f=>t>=f.start&&t<f.end)||timeline.frames.at(-1);const image=images.get(config.cat+'/'+e.frame.mobileFile);
  const roomRect=contact?.roomSpriteRect||[440,572,144,144];const [r,f,z]=ctx;
  r.clearRect(0,0,1024,768);r.drawImage(scene,0,0);r.drawImage(image,...roomRect);
  if(config.marker&&contact){const point=contact.targetRoomPoint;r.fillStyle='#e1384d';r.fillRect(point[0]-3,point[1]-3,6,6);r.strokeStyle='#fff';r.strokeRect(point[0]-4,point[1]-4,8,8);}
  for(const c of [f,z]){c.clearRect(0,0,c.canvas.width,c.canvas.height);c.drawImage(image,0,0,c.canvas.width,c.canvas.height);}
  document.getElementById('metric').textContent=`视口 ${innerWidth}px · ${config.cat} / ${config.action} / ${e.segment} 第 ${e.index+1} 帧 · 播放 ${timeline.duration} ms`;
  return {cat:config.cat,action:config.action,segment:e.segment,index:e.index};}
 function tick(now){if(timeline.frames)draw(force??now-start);requestAnimationFrame(tick);}
 document.getElementById('catChoice').onchange=async e=>{config.cat=e.target.value;await switchTo();};
 document.getElementById('actionChoice').onchange=async e=>{config.action=e.target.value;await switchTo();};
 document.getElementById('marker').onchange=e=>{config.marker=e.target.checked;};
 document.getElementById('restart').onclick=()=>{force=null;start=performance.now();};
 window.previewApi={async set(o){config={...config,...o};document.getElementById('catChoice').value=config.cat;document.getElementById('actionChoice').value=config.action;document.getElementById('marker').checked=config.marker;await switchTo();return timeline.duration;},sample(t){force=t;return draw(t);},resume(){force=null;start=performance.now();},duration(){return timeline.duration;},dimensions(){return [room,focus,zoom].map(c=>c.getBoundingClientRect().width)}};
 await switchTo();requestAnimationFrame(tick);return{cats:3,actions:4};
})().catch(e=>{document.getElementById('error').textContent=String(e.stack||e);throw e;});
</script>
</html>
